name: Promote

# Turns a tester build into a store release without rebuilding it: drafts the
# GitHub release vX.Y.Z on the same commit with the same .wgt, and writes the
# store notes. Samsung TV Seller Office has no upload API, so a maintainer
# uploads that .wgt in Seller Office, and publishes the GitHub release once
# Samsung approves it (published.yml takes it from there).
# See docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tester build to release, for example v1.1.0-beta.22"
        required: true
        type: string

# Shares release.yml's group, so a tester build and a promotion never overlap.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  promote:
    name: Promote ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # draft the release
    env:
      GH_TOKEN: ${{ github.token }}
      BETA_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tester build
        id: build
        run: |
          python3 scripts/release-version.py beta "${BETA_TAG}" > build.txt
          cat build.txt >> "${GITHUB_OUTPUT}"
          release_tag="$(sed -n 's/^release_tag=//p' build.txt)"
          # A failed upload leaves the tester build as a draft, which testers never got.
          if [[ "$(gh release view "${BETA_TAG}" --json isPrerelease,isDraft --jq '"\(.isPrerelease) \(.isDraft)"' 2>/dev/null || true)" != "true false" ]]; then
            echo "::error::${BETA_TAG} has no published tester build on GitHub."
            exit 1
          fi
          if gh release view "${release_tag}" > /dev/null 2>&1; then
            echo "::error::${release_tag} already exists (possibly as a draft). Delete the draft to promote again."
            exit 1
          fi
          commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BETA_TAG}" --jq .sha)"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          # Notes cover everything since the last store release, or every
          # change when there is none yet.
          previous_release="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          echo "previous_release=${previous_release}" >> "${GITHUB_OUTPUT}"

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ steps.build.outputs.release_tag }}
          COMMIT: ${{ steps.build.outputs.commit }}
          PREVIOUS_RELEASE: ${{ steps.build.outputs.previous_release }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${RELEASE_TAG}" -f target_commitish="${COMMIT}" \
            ${PREVIOUS_RELEASE:+-f previous_tag_name="${PREVIOUS_RELEASE}"} --jq .body > notes.md
          python3 scripts/release-version.py store-notes 500 < notes.md > store-notes.txt
          cat store-notes.txt

      - name: Draft the GitHub release
        env:
          VERSION: ${{ steps.build.outputs.version }}
          BUILD: ${{ steps.build.outputs.build }}
          RELEASE_TAG: ${{ steps.build.outputs.release_tag }}
          COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          name="silo-tizen-${VERSION}-${BUILD}.wgt"
          gh release download "${BETA_TAG}" --dir wgt --pattern "${name}" --pattern "${name}.sha256"
          (cd wgt && sha256sum --check "${name}.sha256")
          {
            echo "Silo for Tizen ${VERSION}, build ${BUILD}: the tester build ${BETA_TAG}, on the Samsung TV store."
            echo
            cat notes.md
            echo
            echo "### Install"
            echo
            echo "Get Silo from the Apps store on your Samsung TV."
            echo "To install the package yourself: \`${name}\`, checked with its \`.sha256\` file."
          } > body.md
          gh release create "${RELEASE_TAG}" --draft --target "${COMMIT}" \
            --title "Silo for Tizen ${VERSION}" --notes-file body.md "wgt/${name}" "wgt/${name}.sha256"
          {
            echo "Drafted ${RELEASE_TAG} with \`${name}\`."
            echo
            echo "Next, in [TV Seller Office](https://seller.samsungapps.com/tv/):"
            echo
            echo "1. **Applications > App Package > Upload**: upload \`${name}\` from the ${RELEASE_TAG} draft."
            echo "2. Paste the store notes below into the release notes and submit the version for certification."
            echo "3. Publish the ${RELEASE_TAG} GitHub release once Samsung approves it."
            echo
            echo "### Store notes"
            echo
            # Indented, so the text shows as a code block whatever it contains.
            sed 's/^/    /' store-notes.txt
          } >> "${GITHUB_STEP_SUMMARY}"
