name: Store release published

# When a store release (vX.Y.Z) is published, copy its .wgt to the fixed name
# silo-tizen-latest.wgt, so releases/latest/download/silo-tizen-latest.wgt
# always serves the newest store release. Tester builds are prereleases, so
# they never move this link.

on:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  latest-wgt:
    name: Update the latest .wgt link
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Copy the .wgt to the latest name
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "${TAG} is not a store release tag; nothing to do."
            exit 0
          fi
          gh release download "${TAG}" --dir wgt --pattern 'silo-tizen-[0-9]*.wgt'
          matches=(wgt/silo-tizen-[0-9]*.wgt)
          if [[ ${#matches[@]} -ne 1 || ! -s "${matches[0]}" ]]; then
            echo "::error::Expected one silo-tizen .wgt on ${TAG}."
            exit 1
          fi
          mkdir latest
          cp "${matches[0]}" latest/silo-tizen-latest.wgt
          gh release upload "${TAG}" latest/silo-tizen-latest.wgt --clobber
